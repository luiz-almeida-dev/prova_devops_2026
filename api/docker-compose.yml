name: avaliacao-products

services:
  api:
    build: .
    ports:
      - "${API_BIND_IP:-127.0.0.1}:3000:3000"
    environment:
      WEB_ORIGIN: "${WEB_ORIGIN:?Set WEB_ORIGIN}"
      DB_HOST: mysql
      DB_NAME: "${MYSQL_DATABASE:?Set MYSQL_DATABASE}"
      DB_USER: "${MYSQL_USER:?Set MYSQL_USER}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Set MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER:?Set MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-products.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --user="$$MYSQL_USER" --database="$$MYSQL_DATABASE" --execute="SELECT id FROM products LIMIT 0"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
