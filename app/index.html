<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="api-base-url" content="">
  <title>Cadastro de produtos</title>
  <link rel="stylesheet" href="styles.css">
  <script src="products.js" defer></script>
</head>
<body>
  <main>
    <h1>Cadastro de produtos</h1>

    <section aria-labelledby="form-title">
      <h2 id="form-title">Novo produto</h2>
      <form id="product-form" method="post">
        <div class="fields">
          <label>Nome do produto
            <input name="name" type="text" required>
          </label>
          <label>Categoria
            <input name="category" type="text" required>
          </label>
          <label>Preço
            <input name="price" type="number" min="0" step="0.01" required>
          </label>
          <label>Quantidade em estoque
            <input name="quantity" type="number" min="0" step="1" required>
          </label>
        </div>
        <button type="submit">Cadastrar produto</button>
      </form>
      <p id="form-message" class="message" role="status"></p>
    </section>

    <section aria-labelledby="list-title">
      <div class="section-header">
        <h2 id="list-title">Produtos cadastrados</h2>
        <button id="list-button" class="secondary" type="button">Listar todos os produtos</button>
      </div>
      <p id="list-message" class="message" role="status"></p>
      <div class="table-container" id="product-list" hidden>
        <table aria-labelledby="list-title">
          <thead>
            <tr>
              <th scope="col">Nome do produto</th>
              <th scope="col">Categoria</th>
              <th scope="col">Preço</th>
              <th scope="col">Quantidade em estoque</th>
            </tr>
          </thead>
          <tbody id="product-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
