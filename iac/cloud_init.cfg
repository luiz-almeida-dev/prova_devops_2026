#cloud-config
hostname: ${jsonencode(hostname)}
manage_etc_hosts: true

users:
  - default
  - name: ${jsonencode(ssh_user)}
    groups: [adm, sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${jsonencode(ssh_key)}

ssh_pwauth: false
disable_root: true

packages:
  - openssh-server

runcmd:
  - [systemctl, enable, --now, ssh.service]
